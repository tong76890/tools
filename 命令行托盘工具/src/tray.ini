[program]
; 路径支持环境变量；相对路径以 CommandTray.exe 所在目录为基准。
; 示例：path=tools\server.exe
path=%SystemRoot%\System32\cmd.exe
; 参数按 Windows 命令行规则填写，含空格的参数请加双引号。
arguments=/k "echo CommandTray is ready."
; 留空使用目标程序所在目录。
working_directory=
; 启动时是否隐藏目标窗口。
hide_on_start=true
; SSHD/Cygwin 等需要自行创建子进程的程序可设为 false。
manage_process_tree=true
